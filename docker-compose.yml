services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relieftrail
      POSTGRES_USER: relieftrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - relieftrail_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relieftrail -d relieftrail"]
      interval: 5s
      timeout: 3s
      retries: 10
  app-role-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relieftrail
      POSTGRES_USER: relieftrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-only-change-before-deployment}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    volumes:
      - ./database/bootstrap-app-role.sql:/bootstrap/bootstrap-app-role.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until pg_isready -h db -U relieftrail -d relieftrail; do sleep 1; done
      psql -h db -U relieftrail -d relieftrail -v ON_ERROR_STOP=1 -f /bootstrap/bootstrap-app-role.sql
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://relieftrail_app:${APP_DB_PASSWORD:-local-app-only-change-before-deployment}@db:5432/relieftrail
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-only-change-before-deployment}
      APP_ENV: ${APP_ENV:-demo}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-demo-only-change-before-deployment}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@relieftrail.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      app-role-init:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  relieftrail_data:
