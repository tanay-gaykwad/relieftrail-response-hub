services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relieftrail
      POSTGRES_USER: relieftrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports:
      - "5432:5432"
    volumes:
      - relieftrail_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relieftrail -d relieftrail"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://relieftrail:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/relieftrail
      APP_ENV: demo
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-demo-only-change-before-deployment}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@relieftrail.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  relieftrail_data:

