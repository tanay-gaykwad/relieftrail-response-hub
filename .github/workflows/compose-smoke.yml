name: Full Compose application smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: demo
      APP_SECRET_KEY: ci-only-compose-smoke-secret-not-for-deployment
      APP_DB_PASSWORD: ci-only-app-db-password
      POSTGRES_PASSWORD: ci-only-postgres-bootstrap-password
      DEMO_EMAIL: admin@relieftrail.test
      DEMO_PASSWORD: demo-change-me
    steps:
      - name: Check out ResponseHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP smoke-test client
        run: python -m pip install "httpx>=0.27,<1.0"

      - name: Build and start the full application
        run: docker compose up --build --detach

      - name: Wait for frontend and API
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/api/health >/dev/null &&
               curl --silent --fail http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

      - name: Verify login and response CRUD through the running stack
        run: |
          python - <<'PY'
          import httpx

          with httpx.Client(base_url="http://127.0.0.1:8000", follow_redirects=True) as client:
              csrf_response = client.get("/api/auth/csrf")
              assert csrf_response.status_code == 200, csrf_response.text
              csrf_token = client.cookies.get("rt_csrf")
              assert csrf_token, "CSRF cookie was not issued"

              login = client.post(
                  "/api/auth/login",
                  json={"email": "admin@relieftrail.test", "password": "demo-change-me"},
                  headers={"X-CSRF-Token": csrf_token},
              )
              assert login.status_code == 200, login.text
              organization_id = login.json()["organizations"][0]["organization_id"]

              initial = client.get("/api/responses", params={"organization_id": organization_id})
              assert initial.status_code == 200, initial.text
              assert initial.json(), "Seeded responses were not returned from PostgreSQL"

              created = client.post(
                  "/api/responses",
                  json={
                      "organization_id": organization_id,
                      "code": "CI-SMOKE-01",
                      "title": "Compose smoke response",
                      "location": "Test District",
                      "summary": "Temporary record used to verify the local Compose workflow.",
                  },
                  headers={"X-CSRF-Token": csrf_token},
              )
              assert created.status_code == 201, created.text
              response_id = created.json()["id"]

              updated = client.patch(
                  f"/api/responses/{response_id}",
                  json={"summary": "Updated record read back from PostgreSQL."},
                  headers={"X-CSRF-Token": csrf_token},
              )
              assert updated.status_code == 200, updated.text
              assert updated.json()["summary"] == "Updated record read back from PostgreSQL."

              listed = client.get("/api/responses", params={"organization_id": organization_id})
              assert listed.status_code == 200, listed.text
              assert any(row["id"] == response_id for row in listed.json())

              deleted = client.delete(
                  f"/api/responses/{response_id}",
                  headers={"X-CSRF-Token": csrf_token},
              )
              assert deleted.status_code == 204, deleted.text

              after_delete = client.get("/api/responses", params={"organization_id": organization_id})
              assert after_delete.status_code == 200, after_delete.text
              assert all(row["id"] != response_id for row in after_delete.json())

              frontend = client.get("http://127.0.0.1:5173/")
              assert frontend.status_code == 200, frontend.text
              assert "id=\"root\"" in frontend.text
          PY

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the demo stack and remove its temporary database
        if: always()
        run: docker compose down --volumes --remove-orphans
