name: ResponseHub quality checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relieftrail_test
          POSTGRES_USER: relieftrail
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relieftrail -d relieftrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://relieftrail:test-only-password@localhost:5432/relieftrail_test
      APP_SECRET_KEY: ci-only-secret-not-used-for-real-deployment
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Initialize disposable test database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql
      - name: Run backend tests
        run: pytest backend/tests -q
      - name: Lint backend
        run: ruff check backend --select E4,E7,E9,F

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
